<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ルナビィv2を更新中</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#05070a;color:#e4ebf6;font-family:system-ui,sans-serif}.box{max-width:28rem;padding:2rem;text-align:center}.small{color:#9ca9b9;font-size:.9rem;line-height:1.7}</style>
<main class="box"><h1>ルナビィv2を更新しています</h1><p id="status" class="small">最新版を確認しています。</p></main>
<script>
 (async () => {
   const status=document.getElementById('status');
   try {
     if ('serviceWorker' in navigator) {
       let registration=await navigator.serviceWorker.getRegistration('./');
       if (!registration) registration=await navigator.serviceWorker.register('./sw.js', { scope:'./' });
       await registration.update();
       const installing=registration.installing;
       if (installing) {
         await new Promise((resolve, reject) => {
           const timeout=setTimeout(() => reject(new Error('service worker update timeout')), 10000);
           const finish=() => { clearTimeout(timeout); resolve(); };
           if (installing.state === 'activated') finish();
           else if (installing.state === 'redundant') reject(new Error('service worker update rejected'));
           else installing.addEventListener('statechange', () => {
             if (installing.state === 'activated') finish();
             else if (installing.state === 'redundant') reject(new Error('service worker update rejected'));
           });
         });
       }
       await navigator.serviceWorker.ready;
       const worker=registration.active || navigator.serviceWorker.controller;
       if (!worker) throw new Error('service worker is not active');
       const result=await new Promise((resolve, reject) => {
         const channel=new MessageChannel();
         const timeout=setTimeout(() => reject(new Error('repair timeout')), 30000);
         channel.port1.onmessage=event => { clearTimeout(timeout); resolve(event.data); };
         worker.postMessage({ type:'REPAIR_SHELL' }, [channel.port2]);
       });
       if (!result || !result.ok) throw new Error('repair failed');
       status.textContent='必要なファイルを保存しました。起動しています。';
       location.replace('./?updated=lunaby-v2-r27-'+Date.now().toString(36));
       return;
     }
     throw new Error('service worker unavailable');
   } catch (_) {
     status.textContent='通信できなかったため、現在のデータは変更していません。通信状態を確認して、もう一度LUNABYを押してください。';
   }
 })();
</script>
