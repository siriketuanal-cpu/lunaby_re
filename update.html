<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ルナビィv2を更新中</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#05070a;color:#e4ebf6;font-family:system-ui,sans-serif}.box{max-width:28rem;padding:2rem;text-align:center}.small{color:#9ca9b9;font-size:.9rem;line-height:1.7}</style>
<main class="box"><h1>ルナビィv2を更新しています</h1><p id="status" class="small">最新版を確認しています。</p></main>
<script>
 (async () => {
   const status=document.getElementById('status');
   try {
     if ('serviceWorker' in navigator) {
       const registration=await navigator.serviceWorker.getRegistration('./');
       if (registration) {
         await registration.update();
         const installing=registration.installing;
         if (installing) {
           await new Promise(resolve => {
             const finish=()=>resolve();
             installing.addEventListener('statechange', () => {
               if (installing.state === 'activated' || installing.state === 'redundant') finish();
             }, { once:false });
             setTimeout(finish, 5000);
           });
         }
       }
     }
   } catch (_) {}
   status.textContent='最新のルナビィv2を開いています。';
   location.replace('./?updated=lunaby-v2-r24-'+Date.now().toString(36));
 })();
</script>
