<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>ルナビィ — v2専用</title>
  <meta name="theme-color" content="#05070a">
  <meta name="application-name" content="ルナビィ">
  <!-- 致命的レイアウトは HTML 内に持つ。text-list.css が欠ける／古いキャッシュでも
       上余白と更新ボタンが「消えた／テキストリンクだけ」にならないようにする。 -->
  <style>
    html,body{height:100%;margin:0;background:#05070a;color:#e4ebf6;}
    body{position:fixed;inset:0;overflow:hidden;}
    .page{
      position:relative;width:min(760px,100%);margin:0 auto;
      padding:250px 12px 28px;box-sizing:border-box;
    }
    @media (max-width:440px){
      .page{padding:230px 8px 24px;}
    }
    .update-corner{
      position:fixed;top:10px;left:10px;z-index:20;
      width:28px;height:28px;display:flex;align-items:center;justify-content:center;
      border-radius:8px;border:1px solid rgba(174,187,209,.35);
      background:rgba(5,7,10,.55);color:#aebbd1;
      font:700 14px/1 system-ui,sans-serif;text-decoration:none;opacity:.72;
      -webkit-tap-highlight-color:transparent;touch-action:manipulation;
      box-sizing:border-box;
    }
    .update-corner:active{color:#72dbea;border-color:#72dbea;opacity:1;}
  </style>
  <link rel="manifest" href="manifest.json">
  <!-- ランチャー／タスク一覧用：複数サイズ＋apple-touch を明示（Chromeアイコン落ち防止） -->
  <link rel="icon" type="image/png" sizes="192x192" href="lunaby-neko-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="lunaby-neko-512.png">
  <!-- 詳細スタイル。欠けても上の inline で余白・更新ボタンは維持される -->
  <!-- パス固定キャッシュ（?rev= なし）。更新は LUNABY → REPAIR_SHELL のみ -->

  <style id="lunaby-bundled-css">
:root{color-scheme:dark;--bg:#05070a;--line:#273346;--line-soft:#182231;--ink:#e4ebf6;--muted:#8290a5;--cyan:#72dbea;--orange:#f1a66a;--violet:#c6b5ff;--green:#70eab2;--focus:#b9aaff;--group-moon:#6685b5;--group-lilac:#d8dee8;--group-tide:#68a39b;--timer-number-font:Roboto,system-ui,sans-serif;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
[hidden]{display:none!important;}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overscroll-behavior-y:none;}
/* このアプリは一画面に収まる前提。position:fixed でドキュメント自体を
   スクロール不能にし、iOSの「フォーカスした入力欄を自動で画面内へ
   スクロールする」ネイティブ挙動ごと無効化する（JS側での抑止が不要になる）。 */
body{position:fixed;inset:0;overflow:hidden;touch-action:pan-x;}

/* タスク凍結からの復帰時：DOM更新を覆ってから、ゆっくり画面へ戻す。
   Android/TWAのコンポジタが「古い描画→新しい描画」と瞬間的に切り替わる
   フラッシュを見せにくくするための復帰用ベール。 */
.resume-veil{
  position:fixed;
  inset:0;
  z-index:10000;
  background:#05070a;
  opacity:0;
  pointer-events:none;
  transition:none;
}
/* カバー中は完全不透明＋タップ止め（古い数字の透過／誤タップ防止） */
.resume-veil.is-covering{
  opacity:1;
  pointer-events:auto;
}
.resume-veil.is-revealing{
  opacity:0;
  pointer-events:none;
  transition:opacity 320ms cubic-bezier(.22,.61,.36,1);
  will-change:opacity;
}

/* Android TWA / standalone：フェードはやや短め */
@media (display-mode: standalone), (display-mode: fullscreen), (display-mode: minimal-ui){
  .resume-veil.is-revealing{
    transition-duration:260ms;
  }
}

.page,.page *{user-select:none;-webkit-user-select:none;}
.page{position:relative;width:min(760px,100%);margin:0 auto;padding:250px 12px 28px;}
.update-corner{
  position:fixed;
  top:10px;
  left:10px;
  z-index:20;
  width:28px;
  height:28px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:8px;
  border:1px solid rgba(174,187,209,.35);
  background:rgba(5,7,10,.55);
  color:#aebbd1;
  font:700 14px/1 system-ui,sans-serif;
  text-decoration:none;
  opacity:.72;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
.update-corner:active{
  color:var(--cyan);
  border-color:var(--cyan);
  opacity:1;
}
/* 下線はドットアビス側の締め（旧SL上辺と同じ太さ・色）。SL本体は出さない */
.account-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 10px;border-bottom:2px solid #52617a;padding-bottom:6px;}
.account{min-width:0;max-width:100%;overflow:hidden;padding:6px 0 0;border-top:2px solid #52617a;}
.account.group-0{border-top-color:var(--group-moon);}
.account.group-1{border-top-color:var(--group-lilac);}
.account.group-2{border-top-color:var(--group-tide);}
/* 行全体はタップを透過させ、名前・ランク本体だけ受ける。
   仕切りを外したあとも head と timer は別要素なので、head が空領域まで取ると
   上方向に伸ばしたタイマー側ヒットが境界で消えて見えていた */
.account-head{min-height:13px;padding:0 4px 0;display:flex;align-items:center;justify-content:space-between;color:#c9d4e5;font-weight:800;font-size:6px;line-height:1.1;text-align:left;position:relative;z-index:3;pointer-events:none;}
.name-display{position:relative;z-index:3;min-width:0;max-width:58%;height:13px;cursor:text;touch-action:manipulation;font-weight:800;font-size:11px;line-height:13px;font-family:ui-sans-serif,system-ui,Roboto,sans-serif;pointer-events:auto;}
.name-display-text{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
/* 通常名：上方向のみヒット拡張（下は最大スタミナと被らないよう伸ばさない） */
.name-display::before{content:'';position:absolute;top:-4px;bottom:0;left:-4px;right:-4px;}
.name-display.is-placeholder{font-size:9px;line-height:13px;font-weight:700;color:#6f7d90;max-width:42%;}
.name-display.is-placeholder::before{top:-2px;bottom:0;left:-2px;right:0;}
.rank-display{position:relative;z-index:3;flex:none;box-sizing:border-box;height:13px;line-height:13px;color:var(--orange);font:800 11px/13px var(--timer-number-font);cursor:text;touch-action:manipulation;pointer-events:auto;}
/* 下方向は最小限（放置・最大スタミナ上端を奪わない） */
.rank-display::before{content:'';position:absolute;top:-6px;bottom:-2px;left:-4px;right:-4px;}
.name-input,.rank-input{min-width:0;padding:0;border:0;outline:0;background:transparent;color:#fff;font:inherit;caret-color:transparent!important;appearance:none;-webkit-appearance:none;pointer-events:auto;}
.name-input,.rank-input,.stam-edit{user-select:none;-webkit-user-select:none;touch-action:manipulation;}
.name-input{width:62px;height:13px;min-height:0;max-height:13px;font-size:11px;line-height:13px;}
.rank-input{box-sizing:border-box;width:5ch;height:13px;min-height:0;max-height:13px;line-height:13px;text-align:right;color:var(--orange);font:800 11px/13px var(--timer-number-font);}
/* ===== タイマー行の位置（ここだけ触れば寄せ・余白を調整できる） =====
   文字位置: side-shift（左）/ idle-side-shift（右・固定px）で調整
   ヒット: ::before のみ（レイアウトに影響しない）
   予定時刻: full-clock の inset
   --- 今後の追記ルール ---
   ・:has() は使わない
   ・新規の grid / 1fr 追加は避ける（位置調整が不安定になりやすい実績あり）
   ・既存の grid/flex 基盤は壊さない。触るなら最小変更
   ・位置・ヒットは変数と ::before で足す
*/
.timer-row{
  --clock-inset:6px;
  --clock-size:22px;
  --row-pad-x:4px;
  --stam-side-shift:10px;          /* 左：予定時刻側からの固定寄せ */
  --stam-flex-left:1;
  --stam-flex-right:1;
  --stam-edit-hit-extend:28px;
  --stam-calc-gap-pull:-6px;
  /* 右：予定時刻は右端にあるので、時計幅+inset+スタミナと同じ寄せ分だけ内側（中央方向）へ */
  --idle-side-shift:calc(var(--clock-inset) + var(--clock-size) + var(--stam-side-shift));
  --hit-top:-16px;                 /* head が透過するので上方向に伸ばせる */
  --hit-bottom:-5px;
  /* 数字サイズ固定（解像度依存を外す） */
  --num-size:20px;
  --stam-max-size:11px;            /* 二段：上段の最大スタミナ（余白縮小後に一〜二回り大きく） */
  --stam-cur-size:var(--num-size); /* 二段：下段の現在値 */
  --stam-box-cols:3.1ch;           /* 桁の中心揃え用の固定枠（1〜3桁で中心が動かない） */
}
.task-row{position:relative;width:100%;min-height:24px;padding:2px var(--row-pad-x) 0;border:0;background:transparent;color:var(--ink);text-align:left;font:inherit;}
/* 左右半々で位置を固定。ヒット範囲だけ別レイヤで伸ばす（選択時も幅が変わらない） */
.timer-row{position:relative;display:grid;grid-template-columns:1fr 1fr;align-items:center;column-gap:0;min-height:22px;font-family:var(--timer-number-font);font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;font-kerning:none;}
.task-row:active{background:#080c12;}

/* 全快予定時刻：左右端に固定表示（pointer-events:none → 下のヒットが受ける）
   top は task-row の padding に合わせて少し下げ、現在値・放置タイマーと同じ高さ基準にする */
.full-clock{position:absolute;top:calc(50% + 1.5px);z-index:0;transform:translateY(-50%);display:grid;grid-template-rows:9px 9px;align-items:center;justify-items:center;width:var(--clock-size);height:20px;font-family:var(--timer-number-font);font-variant-numeric:tabular-nums;line-height:9px;font-weight:800;letter-spacing:.02em;pointer-events:none;user-select:none;-webkit-user-select:none;}
.full-clock-hour,.full-clock-minute{display:block;width:100%;text-align:center;}
.full-clock-hour{font-size:9px;color:#91a5bb;}
.full-clock-minute{font-size:9px;color:#a8b7c8;}
.full-clock.is-selected{z-index:21;}
/* スタミナ予定時刻：濃い青系・黒背景で沈みにくい明るめ */
.full-clock-stam .full-clock-hour,
.full-clock-stam .full-clock-minute{color:#7eb0e8;}
/* 放置報酬側は淡い緑で差別化 */
.full-clock-idle .full-clock-hour{color:#58b89a;}
.full-clock-idle .full-clock-minute{color:#68c3a4;}
.full-clock-stam{left:var(--clock-inset);}
.full-clock-idle{right:var(--clock-inset);}

/* 左半分：文字位置は --stam-*、ヒットは ::before のみ（レイアウト非干渉） */
.stam-side{position:relative;left:var(--stam-side-shift);z-index:2;display:flex;align-items:center;min-width:0;min-height:22px;}
.stam-edit-gap{flex:var(--stam-flex-left) 1 0%;min-width:0;align-self:stretch;position:relative;cursor:text;touch-action:manipulation;}
.stam-edit-gap::before{content:'';position:absolute;top:var(--hit-top);bottom:var(--hit-bottom);right:0;left:calc(0px - var(--stam-edit-hit-extend));}
/* スタミナ現在値を基準に中央揃え。最大値は absolute でフロー外に出し、現在値・放置・予定時刻の高さを一致させる */
.stam-stack{
  flex:0 0 auto;
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  box-sizing:border-box;
  width:var(--stam-box-cols);
  min-width:var(--stam-box-cols);
  max-width:var(--stam-box-cols);
  font-size:var(--stam-cur-size);
  min-height:22px;
  padding:0;
  margin:0;
  overflow:visible;
  cursor:pointer;
  touch-action:manipulation;
  z-index:2;
}
.stam-stack::before{content:'';position:absolute;top:var(--hit-top);bottom:var(--hit-bottom);left:-6px;right:-6px;}
/* 最大値：現在値のすぐ上（レイアウト高さに影響させない） */
.stam-stack > .task-max{
  position:absolute;
  left:0;
  right:0;
  bottom:calc(100% + 1px);
  display:block;
  box-sizing:border-box;
  width:100%;
  margin:0;
  padding:0;
  border:0;
  color:#51d8e8;
  font-family:var(--timer-number-font);
  font-weight:700;
  font-size:var(--stam-max-size);
  line-height:1;
  font-variant-numeric:tabular-nums;
  font-feature-settings:"tnum" 1;
  letter-spacing:.02em;
  text-align:center;
  white-space:nowrap;
  opacity:.9;
  pointer-events:none;
}
/* 下段：現在値 */
.stam-stack > .stam-edit-zone{
  position:relative;
  display:grid;
  grid-template-columns:1fr;
  grid-template-rows:1em;
  place-items:center;
  box-sizing:border-box;
  width:100%;
  margin:0;
  padding:0;
  min-width:0;
  min-height:0;
  overflow:hidden;
  cursor:pointer;
  touch-action:manipulation;
}
.stam-stack > .stam-edit-zone::before{content:'';position:absolute;inset:0;}
.stam-calc-gap{flex:var(--stam-flex-right) 1 0%;min-width:0;align-self:stretch;min-height:22px;margin-right:var(--stam-calc-gap-pull);position:relative;z-index:2;cursor:pointer;touch-action:manipulation;}
.stam-calc-gap::before{content:'';position:absolute;top:var(--hit-top);bottom:var(--hit-bottom);left:0;right:0;}

.task-value{display:inline-block;vertical-align:middle;line-height:1;letter-spacing:.01em;text-rendering:geometricPrecision;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;}
.stam-current{
  grid-area:1/1;
  box-sizing:border-box;
  display:block;
  width:100%;
  min-width:0;
  max-width:100%;
  height:1em;
  margin:0;
  padding:0;
  border:0;
  color:#b4becc;
  font-family:var(--timer-number-font);
  font-weight:800;
  font-size:var(--stam-cur-size);
  line-height:1;
  font-variant-numeric:tabular-nums;
  font-feature-settings:"tnum" 1;
  letter-spacing:0;
  text-align:center;
  text-rendering:geometricPrecision;
  cursor:pointer;
  white-space:nowrap;
  overflow:hidden;
}
.stam-side.is-near-full .stam-current{color:#ff7070;}

/* input はブラウザ既定の min-width で隣カードへ食い込みやすいので完全に枠内へ閉じ込める */
.stam-edit,.stam-edit:focus{
  grid-area:1/1;
  box-sizing:border-box;
  z-index:1;
  width:100%!important;
  min-width:0!important;
  max-width:100%!important;
  height:1em;
  margin:0;
  padding:0!important;
  border:0!important;
  border-radius:0!important;
  outline:0!important;
  box-shadow:none!important;
  background:transparent!important;
  color:#b4becc;
  -webkit-text-fill-color:#b4becc;
  font-family:var(--timer-number-font);
  font-weight:800;
  font-size:var(--stam-cur-size);
  line-height:1;
  font-variant-numeric:tabular-nums;
  font-feature-settings:"tnum" 1;
  letter-spacing:0;
  text-align:center;
  text-rendering:geometricPrecision;
  caret-color:transparent!important;
  appearance:none;
  -webkit-appearance:none;
}
.stam-side.is-near-full .stam-edit,.stam-side.is-near-full .stam-edit:focus{color:#ff7070;-webkit-text-fill-color:#ff7070;}
/* 選択中・手入力中：暗転なし。数字の色だけで「ここを操作中」と分かる明るめ */
.stam-edit-zone.is-editing .stam-edit,
.stam-edit-zone.is-editing .stam-edit:focus,
.stam-side.is-selected .stam-current{color:#f2f6fc;-webkit-text-fill-color:#f2f6fc;}
.stam-side.is-selected .task-slash{color:#a8b6c8;}
.stam-side.is-selected .task-max{color:#7ee8f5;}
.stam-side.is-near-full .stam-edit-zone.is-editing .stam-edit,
.stam-side.is-near-full .stam-edit-zone.is-editing .stam-edit:focus,
.stam-side.is-near-full.is-selected .stam-current{color:#ff9a9a;-webkit-text-fill-color:#ff9a9a;}
.stam-side.is-near-full.is-selected .task-max{color:#ffb0b0;}
/* 40計算・手入力中：スタミナ左に ▶（absolute なので桁幅・レイアウトは動かさない） */
.stam-side.is-selected .stam-stack::after,
.stam-side.is-editing .stam-stack::after{
  content:'▶';
  position:absolute;
  left:-0.9em;
  top:50%;
  transform:translateY(-50%);
  font-size:11px;
  line-height:1;
  color:#c8ffe8;
  -webkit-text-fill-color:#c8ffe8;
  font-weight:800;
  pointer-events:none;
  z-index:3;
}

/* 満タン表示は左サイド全体に重ねる */
.stam-full{position:absolute;z-index:3;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;color:#ff7070;font:800 var(--num-size)/1 var(--timer-number-font);letter-spacing:.01em;text-rendering:geometricPrecision;cursor:text;white-space:nowrap;}
.stam-full-time{display:inline-flex;align-items:baseline;}
.stam-full-hour,.stam-full-minute{position:relative;display:inline-block;cursor:pointer;}
.stam-full-hour{min-width:2ch;text-align:right;cursor:text;}
.stam-full-hour::before,.stam-full-minute::before{content:'';position:absolute;top:-6px;bottom:-6px;}
.stam-full-hour::before{left:-8px;right:-3px;}
.stam-full-minute::before{left:-3px;right:-6px;}
.stam-full-colon{pointer-events:none;}
.stam-full-label{margin-left:3px;color:#e4b5ba;font:800 9px/1 var(--timer-number-font);letter-spacing:.04em;vertical-align:middle;}

/* 右サイド：flex配置は維持。右余白だけ固定px（スタミナの side-shift と同じ決め方） */
.idle-zone{position:relative;z-index:2;display:flex;align-items:center;min-width:0;min-height:22px;padding:0;cursor:pointer;touch-action:manipulation;}
.idle-pre{flex:1 1 0%;min-width:0;align-self:stretch;min-height:22px;cursor:pointer;position:relative;z-index:1;}
.idle-pre::before{content:'';position:absolute;top:var(--hit-top);bottom:var(--hit-bottom);left:0;right:0;}
/* min-width でタイマー幅を確保 → 「受取」に変わっても右に寄らない */
.idle-action{flex:0 0 auto;display:flex;align-items:center;justify-content:center;min-width:5.5ch;min-height:20px;cursor:pointer;touch-action:manipulation;position:relative;z-index:2;left:-8px;}
.idle-action::before{content:'';position:absolute;top:var(--hit-top);bottom:var(--hit-bottom);left:0;right:0;}
.idle-post{flex:0 0 var(--idle-side-shift);width:var(--idle-side-shift);min-width:var(--idle-side-shift);align-self:stretch;min-height:22px;cursor:pointer;position:relative;z-index:1;}
.idle-post::before{content:'';position:absolute;top:var(--hit-top);bottom:var(--hit-bottom);left:0;right:0;}
.task-value{margin:0;color:var(--violet);font:800 var(--num-size)/1 var(--timer-number-font);letter-spacing:.01em;text-rendering:geometricPrecision;white-space:nowrap;}
.task-value.is-clock{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;font-kerning:none;letter-spacing:-.04em;}
.task-value.is-pending{font-size:13px;font-weight:700;letter-spacing:.02em;}
.task-plan{margin-left:4px;color:#aab7c9;font:700 10px/1 var(--timer-number-font);white-space:nowrap;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;font-kerning:none;letter-spacing:.01em;text-rendering:geometricPrecision;}
.task-plan.is-full{position:relative;display:inline-block;width:5ch;box-sizing:border-box;margin-left:0;color:#ff7070;font:800 var(--num-size)/1 var(--timer-number-font);letter-spacing:-.03em;text-align:center;white-space:nowrap;}
.task-plan.is-full:not(:empty)::after{content:'満';position:absolute;left:calc(100% + 3px);top:50%;transform:translateY(-50%);margin:0;color:#e4b5ba;font:800 9px/1 var(--timer-number-font);letter-spacing:.04em;}
.idle-zone.is-near-full .task-value,.idle-zone.is-near-full.is-selected .task-value{color:#ff7070;}
.idle-zone.is-selected .task-value,
.idle-zone.is-selected .task-plan,
.idle-zone.is-selected .task-plan.is-full{
  margin-left:0;text-align:center;font-size:14px;font-weight:800;letter-spacing:.02em;
}
/* 「受取」は value / plan どちらに出ても同じ薄黄で統一 */
.idle-zone.is-selected .task-value,

/* lunaby-core.mjs

const SLOT_COUNT = 6;
const STAM_STEP_MS = 3 * 60 * 1000;
const STAM_WARNING_MS = 2 * 60 * 60 * 1000;

const IDLE_LEAD_MS = 5 * 60 * 1000;

const displayClockCache = new WeakMap();

const finite = (value, fallback) => { const number = Number(value); return Number.isFinite(number) ? number : fallback; };

const maxForRank = rank => Math.min(999, STAM_BASE + (clamp(Math.floor(finite(rank, 1)), 1, 200) - 1) * STAM_PER_RANK);

const formatClock = timestamp => {
  const date = new Date(timestamp);

};
const formatMinute = milliseconds => {
  const minutes = Math.max(1, Math.ceil(Math.max(0, finite(milliseconds, 0)) / 60000));

const SLOT_DEFAULTS = Object.freeze({ label:'', rank:1, stamCurrent:0, stamMax:STAM_BASE, stamStart:null, stamRunning:false, idleStart:null, idleCapMs:IDLE_CAP_MS, idleRunning:false, enabled:true });

function normalizeSlot(source) {

  const rank = input.rank != null ? clamp(integer(input.rank, SLOT_DEFAULTS.rank), 1, 200) : rankForMax(input.stamMax);
  const stamMax = maxForRank(rank);
  return runtimeSlot({
    label: typeof input.label === 'string' ? input.label : SLOT_DEFAULTS.label,
    rank,
    stamCurrent: clamp(finite(input.stamCurrent, SLOT_DEFAULTS.stamCurrent), 0, stamMax),
    stamMax,
    stamStart: finite(input.stamStart, null), stamRunning: !!input.stamRunning,
    idleStart: finite(input.idleStart, null), idleCapMs: finite(input.idleCapMs, IDLE_CAP_MS), idleRunning: !!input.idleRunning,

function computeStam(slot, now) {
  const current = clamp(finite(slot.stamCurrent, 0), 0, slot.stamMax);
  if (!slot.stamRunning || !slot.stamStart) return { current, fullAt:null, isFull:current >= slot.stamMax };

  const recovered = Math.floor(elapsed / STAM_STEP_MS);
  const next = Math.min(slot.stamMax, current + recovered);
  if (next >= slot.stamMax) return { current:slot.stamMax, fullAt:slot.stamStart + Math.max(0, slot.stamMax - current) * STAM_STEP_MS, isFull:true };

}

// =============================================================================
// SECTION: starleap-state  (was starleap-state.mjs)
// =============================================================================
const SL_STAM_MAX = 80;
const SL_STAM_STEP_MS = 12 * 60 * 1000;
const SL_ORB_MAX = 4;
const SL_ORB_STEP_MS = 6 * 60 * 60 * 1000;

function normalizeTimer(source, max) {
  const input = source && typeof source === 'object' ? source : {};
  const current = clamp(finite(input.current, 0), 0, max);
  const start = finite(input.start, null);
  return { current, start, running: !!input.running && !!start };
}

function createSLState(source) {
  return { stamina: normalizeTimer(source && source.stamina, SL_STAM_MAX), orb: normalizeTimer(source && source.orb, SL_ORB_MAX) };
}

// =============================================================================
// SECTION: starleap-lite  (was starleap-lite-core.mjs)

const isTimerActive = (timer, max, interval, now) => !!(timer.running && timer.start && timer.current < max && now < timer.start + (max - timer.current) * interval);

function getTimerInfo(timer, max, interval, now, output) {
  const result = output || {};
  const current = clamp(finite(timer.current, 0), 0, max);
  if (!timer.running || !timer.start) { result.current = current; result.running = false; result.isFull = current >= max; result.nextIn = null; result.fullIn = null; result.fullAt = null; return result; }
  const elapsed = Math.max(0, now - timer.start);
  const recovered = Math.floor(elapsed / interval);
  const nextCurrent = Math.min(max, current + recovered);
  const fullAt = timer.start + Math.max(0, max - current) * interval;
  if (nextCurrent >= max) { result.current = max; result.running = false; result.isFull = true; result.nextIn = 0; result.fullIn = 0; result.fullAt = fullAt; return result; }
  const nextIn = interval - (elapsed % interval);
  const fullIn = (max - nextCurrent - 1) * interval + nextIn;
  result.current = nextCurrent; result.running = true; result.isFull = false; result.nextIn = nextIn; result.fullIn = fullIn; result.fullAt = now + fullIn;
  return result;
}

function formatSLDuration(milliseconds) { const totalMinutes = Math.max(1, Math.ceil(Math.max(0, finite(milliseconds, 0)) / 60000)); return Math.floor(totalMinutes / 60) + ':' + String(totalMinutes % 60).padStart(2, '0'); }

function parseFullRecoveryInput(raw) {
  const value = String(raw || '').trim().replace(/：/g, ':');
  if (!value) return null;
  let hours = 0; let minutes = 0;
  if (value.includes(':')) { const parts = value.split(':'); if (parts.length !== 2 || parts.some(part => !/^\d+$/.test(part))) return null; hours = Number(parts[0]); minutes = Number(parts[1]); }
  else if (/^\d+$/.test(value)) { if (value.length <= 2) minutes = Number(value); else { hours = Number(value.slice(0, -2)); minutes = Number(value.slice(-2)); } }
  else return null;
  if (!Number.isInteger(hours) || !Number.isInteger(minutes) || hours < 0 || minutes < 0 || minutes > 59) return null;
  const result = (hours * 60 + minutes) * 60000;
  return result <= SL_ORB_MAX * SL_ORB_STEP_MS ? result : null;
}

function applyStamina(timer, value, now) { const current = clamp(integer(value, timer.current), 0, SL_STAM_MAX); timer.current = current; timer.running = current < SL_STAM_MAX; timer.start = timer.running ? now : null; return timer; }

const V2_STORAGE_KEY = 'lunaby:state:v2';
const V2_VERSION = 2;

const STAM_RUNNING = 1;
const IDLE_RUNNING = 2;
const SLOT_DISABLED = 16;
const SL_STAM_RUNNING = 1;
const SL_ORB_RUNNING = 2;
const SLOT_LABEL = 0;
const SLOT_RANK = 1;
const SLOT_STAM_CURRENT = 2;
const SLOT_STAM_START = 3;
const SLOT_IDLE_START = 4;
const SLOT_FLAGS = 5;
const SLOT_FIELDS = 6;
const SL_STAM_CURRENT = 0;
const SL_STAM_START = 1;
const SL_ORB_CURRENT = 2;
const SL_ORB_START = 3;
const SL_FLAGS = 4;
const SL_FIELDS = 5;

const timestamp = value => {
  const number = finite(value, 0);
  return number > 0 && number < 9_000_000_000_000_000 ? Math.floor(number) : null;
};
const flag = (value, bit) => (Number.isInteger(value) && (value & bit) !== 0);

function packSlot(slot) {
  const flags = (slot.stamRunning ? STAM_RUNNING : 0)
    | (slot.idleRunning ? IDLE_RUNNING : 0)
    | (slot.enabled === false ? SLOT_DISABLED : 0);
  const packed = new Array(SLOT_FIELDS);
  packed[SLOT_LABEL] = slot.label;
  packed[SLOT_RANK] = slot.rank;
  packed[SLOT_STAM_CURRENT] = slot.stamCurrent;
  packed[SLOT_STAM_START] = slot.stamStart || 0;
  packed[SLOT_IDLE_START] = slot.idleStart || 0;
  packed[SLOT_FLAGS] = flags;
  return packed;
}

function unpackSlot(input) {
  if (!Array.isArray(input) || input.length !== SLOT_FIELDS || typeof input[SLOT_LABEL] !== 'string' || !Number.isInteger(input[SLOT_FLAGS])) return null;
  const flags = input[SLOT_FLAGS];
  return normalizeSlot({
    label: input[SLOT_LABEL],
    rank: input[SLOT_RANK],
    stamCurrent: input[SLOT_STAM_CURRENT],
    stamStart: timestamp(input[SLOT_STAM_START]),
    stamRunning: flag(flags, STAM_RUNNING),
    idleStart: timestamp(input[SLOT_IDLE_START]),
    idleRunning: flag(flags, IDLE_RUNNING),
    enabled: !flag(flags, SLOT_DISABLED)
  });
}

function packSL(sl) {
  const flags = (sl.stamina.running ? SL_STAM_RUNNING : 0) | (sl.orb.running ? SL_ORB_RUNNING : 0);
  const packed = new Array(SL_FIELDS);
  packed[SL_STAM_CURRENT] = sl.stamina.current;
  packed[SL_STAM_START] = sl.stamina.start || 0;
  packed[SL_ORB_CURRENT] = sl.orb.current;
  packed[SL_ORB_START] = sl.orb.start || 0;
  packed[SL_FLAGS] = flags;
  return packed;
}

function unpackSL(input) {
  if (!Array.isArray(input) || input.length !== SL_FIELDS || !Number.isInteger(input[SL_FLAGS])) return null;
  const flags = input[SL_FLAGS];
  return createSLState({
    stamina: { current: input[SL_STAM_CURRENT], start: timestamp(input[SL_STAM_START]), running: flag(flags, SL_STAM_RUNNING) },
    orb: { current: input[SL_ORB_CURRENT], start: timestamp(input[SL_ORB_START]), running: flag(flags, SL_ORB_RUNNING) }
  });

function parseV2(storage) {
  let value = null;
  try { value = JSON.parse(storage.getItem(V2_STORAGE_KEY) || 'null'); } catch (_) { return null; }
  if (!value || value.v !== V2_VERSION || !Array.isArray(value.s) || value.s.length !== SLOT_COUNT) return null;
  const slots = value.s.map(unpackSlot);
  const sl = unpackSL(value.l);

}

function packState(slots, sl) {
  return { v:V2_VERSION, s:slots.map(packSlot), l:packSL(sl) };
}

function makeLoaded(envelope, slots, sl, source, migrated) {
  return { envelope, slots, sl, source, migrated };
}

function loadExistingV2Store(storage) {
  const v2 = parseV2(storage);
  return v2 ? makeLoaded(v2.envelope, v2.slots, v2.sl, 'v2', false) : null;
}

function saveV2Store(storage, envelope, slots, changedIndex, sl) {
  const target = envelope && envelope.v === V2_VERSION ? envelope : packState(slots, sl);
  let changed = false;
  const indexes = Number.isInteger(changedIndex) && changedIndex >= 0 && changedIndex < slots.length
    ? [changedIndex]
    : slots.map((_, index) => index);

  for (const index of indexes) {
    const slot = slots[index];
    if (!slot || !slot.dirty) continue;
    target.s[index] = packSlot(slot);
    slot.dirty = false;
    changed = true;

    const nextSL = packSL(sl);

    if (!prev || prev.length !== nextSL.length || nextSL.some((value, i) => value !== prev[i])) {

      changed = true;
    }
  }

  storage.setItem(V2_STORAGE_KEY, JSON.stringify(target));
  return true;
}

  // スタミナ行だけ描画（名前・ランク・放置は触らない）

  function paintStamRow(index, now, options){
    const ref = refs[index];

    if (!ref || !slot) return;

    const force = !!(options && options.force);
    const busy = editIs('stam', index) || (selected && selected.index === index && selected.task === 'stam');

    const snapshot = options && options.snapshot
      ? options.snapshot

  // 放置行だけ描画（名前・ランク・スタミナは触らない）
  function paintIdleRow(index, now, options){

  function paintName(index){

  function paintRank(index){

  function scheduleRefresh(){
    if (refreshTimer) { clearTimeout(refreshTimer); refreshTimer = null; }
    if (document.hidden || edit) return;
    const now = Date.now();
    let dotTimed = false;
    for (let index = 0; index < state.slots.length; index += 1) { if (refs[index] && hasTimedProgress(state.slots[index], now)) { dotTimed = true; break; } }
    if (!dotTimed) return;

  }
  function syncTimedSlots(){
    const now = Date.now();
    refreshSL(now);
    for (let index = 0; index < state.slots.length; index += 1) {
      const slot = state.slots[index];
      const ref = refs[index];
      if (!ref) continue;
      if (!slot.idleRunning && !slot.stamRunning) continue;
      // 同一 snapshot を共有するため、更新前の値を先に撮ってから1回だけ displaySnapshot する。
      // （先に放置を描くと stam.current が先に進み、スタミナが「変化なし」でスキップされる不具合を防ぐ）
      const prevStamCurrent = ref.snapshot.stam.current;
      const prevStamLow = !!ref.snapshot.stam.low;
      const prevIdleValue = ref.snapshot.idle.value;
      const prevIdleFull = !!ref.snapshot.idle.full;
      const prevIdleLow = !!ref.snapshot.idle.low;
      const snapshot = displaySnapshot(slot, now, ref.snapshot);
      if (slot.idleRunning) {
        paintIdleRow(index, now, { snapshot, prevIdleValue, prevIdleFull, prevIdleLow });

  // 復帰時：内部時刻はすぐ合わせ、DOM は「変化した行だけ」を1フレームにまとめて書く。
  // force 全描画や選択クリアの force 再描画は、値が同じでも hidden/class を触って点滅しやすい。
  function syncTimersAfterResume(){
    const now = Date.now();
    // 選択・編集は状態だけ外す（ここでは force 再描画しない）
    const hadSelected = selected;
    const hadEdit = edit;
    if (selected) selected = null;
    if (edit) {
      const idx = edit.index;
      edit = null;
      // input を閉じる最小処理（行全体の force はしない）
      const ref = refs[idx];
      if (ref) {
        setHidden(ref.nameInput, true);
        setHidden(ref.nameDisplay, false);
        setHidden(ref.rankInput, true);
        setHidden(ref.rankDisplay, false);
        setHidden(ref.stamInput, true);
        setClass(ref.stamInput.parentElement, 'is-editing', false);
        setClass(ref.stamRow, 'is-editing', false);
      }
      paintName(idx);
      paintRank(idx);
    }
    // スナップショット計算は同期で行い、DOM 書き込みだけ rAF に載せる
    const jobs = [];
    for (let index = 0; index < state.slots.length; index += 1) {
      const ref = refs[index];
      if (!ref) continue;
      const slot = state.slots[index];
      if (!slot.stamRunning && !slot.idleRunning) continue;
      const prevStamCurrent = ref.snapshot.stam.current;
      const prevStamLow = !!ref.snapshot.stam.low;
      const prevIdleValue = ref.snapshot.idle.value;
      const prevIdleFull = !!ref.snapshot.idle.full;
      const prevIdleLow = !!ref.snapshot.idle.low;
      const snapshot = displaySnapshot(slot, now, ref.snapshot);
      if (slot.stamRunning) {
        jobs.push({ kind:'stam', index, snapshot, prevStamCurrent, prevStamLow });
      }
      if (slot.idleRunning) {
        jobs.push({ kind:'idle', index, snapshot, prevIdleValue, prevIdleFull, prevIdleLow });
      }
    }
    // 選択中だった行は、プレビュー数字/ハイライト解除のため必ず force で戻す
    // （値が同じでも差分スキップされると40プレビューが残る）
    if (hadSelected && refs[hadSelected.index]) {
      const index = hadSelected.index;
      const kind = hadSelected.task === 'idle' ? 'idle' : 'stam';
      for (let i = jobs.length - 1; i >= 0; i -= 1) {
        if (jobs[i].index === index && jobs[i].kind === kind) jobs.splice(i, 1);
      }
      const ref = refs[index];
      const slot = state.slots[index];
      if (slot && ref) {
        const snapshot = displaySnapshot(slot, now, ref.snapshot);
        if (kind === 'idle') {
          jobs.push({
            kind:'idle', index, snapshot,
            prevIdleValue: snapshot.idle.value,
            prevIdleFull: !!snapshot.idle.full,
            prevIdleLow: !!snapshot.idle.low,
            force:true
          });
        } else {
          jobs.push({
            kind:'stam', index, snapshot,
            prevStamCurrent: snapshot.stam.current,
            prevStamLow: !!snapshot.stam.low,
            force:true
          });
        }
      }
    }
    const runJobs = () => {
      if (document.hidden) return;
      for (const job of jobs) {
        if (job.kind === 'stam') {
          paintStamRow(job.index, now, {
            snapshot: job.snapshot,
            prevStamCurrent: job.prevStamCurrent,
            prevStamLow: job.prevStamLow,
            force: !!job.force
          });
        } else {
          paintIdleRow(job.index, now, {
            snapshot: job.snapshot,
            prevIdleValue: job.prevIdleValue,
            prevIdleFull: job.prevIdleFull,
            prevIdleLow: job.prevIdleLow,
            force: !!job.force
          });
        }

      refreshSL(now);
      scheduleRefresh();

    // ブラウザの描画フレームに乗せて、途中経過の再フローを減らす
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(runJobs);

  }

  function beginResumeCover(){
    const veil = document.getElementById('resume-veil');

    veil.classList.add('is-covering');
  }

  function revealAfterResume(){
    const veil = document.getElementById('resume-veil');
    if (!veil) return;
    if (resumeRevealTimer) clearTimeout(resumeRevealTimer);
    // DOM更新を1フレーム確定させてからベールをモード別の時間で外す。
    requestAnimationFrame(() => {
      if (document.hidden) return;
      // class切替を確実に別描画に分離する。
      requestAnimationFrame(() => {
        if (document.hidden) return;
        veil.classList.remove('is-covering');
        veil.classList.add('is-revealing');
        resumeRevealTimer = setTimeout(() => {
          resumeRevealTimer = null;
          veil.classList.remove('is-revealing');
        }, RESUME_REVEAL_CLEANUP);

    });
  }

  const standaloneResumeMode = (() => {

  function resumeSyncDelayMs(){
    const gone = hiddenAt ? (Date.now() - hiddenAt) : 0;
    if (standaloneResumeMode) {
      if (gone > 0 && gone < 3000) return 160;   // すぐ戻った
      if (gone >= 60000) return 240;             // 長時間凍結
      return 190;                               // 通常のタスク復帰
    }
    if (gone > 0 && gone < 3000) return 200;
    if (gone >= 60000) return 280;
    return 240;
  }

  function syncAfterResume(){
    // 冷起動中の visibility は復帰扱いしない（ベールを出さない）
    if (!appReady || document.hidden) return;
    const now = Date.now();
    // 連続する visibility / pageshow をまとめ、二重復帰を防ぐ。
    if (now - lastResumeSyncAt < 320) return;
    lastResumeSyncAt = now;

    const delay = resumeSyncDelayMs();

    if (resumeSyncTimer) clearTimeout(resumeSyncTimer);
    resumeSyncTimer = setTimeout(() => {
      resumeSyncTimer = null;
      if (document.hidden) return;
      syncTimersAfterResume();
      revealAfterResume();
    }, delay);
  }

  // displaySnapshot は使わず liveStam だけ見て最小描画を維持（長時間放置後の初回反応を軽くする）。
  function paintStamSelection(index, previewValue){

  function selectTask(index, task){

    const previousTask = selected ? selected.task : null;
    const previewValue = task === 'stam'
      ? remainingAfter40(liveStam(state.slots[index], Date.now()))
      : null;
    selected = task === 'stam'
      ? { index, task, value:previewValue }
      : { index, task };
    if (Number.isFinite(previousIndex) && (previousIndex !== index || previousTask !== task)) {
      clearSelectionVisual(previousIndex, previousTask);
    }
    if (task === 'idle') paintIdleSelection(index);
    else paintStamSelection(index, previewValue);
  }
  function confirmTask(index, task){
    const slot = state.slots[index];
    const now = Date.now();
    if (task === 'stam') applyStam(slot, selected.value, now);
    else if (task === 'idle') restartIdle(slot, now);
    // UIを先に確定してから永続化。localStorage が端末で遅いと
    // 保存が終わるまで画面遷移が遅延して体感が悪くなるため。
    selected = null;
    if (task === 'stam') paintStamRow(index, now, { force:true });
    else paintIdleRow(index, now, { force:true });
    scheduleRefresh();
    // localStorage.setItem は同期I/Oで詰まることがあるため、確定タップの描画が
    // 実際に画面へコミットされるのを待ってから書き込む（rAF→setTimeout(0)で1フレーム後ろへ）。
    requestAnimationFrame(() => setTimeout(() => write(index), 0));
  }
  function activate(index, task){
    const same = selected && selected.index === index && selected.task === task;
    if (!same) selectTask(index, task);
    else confirmTask(index, task);
  }

  function setupEvents(){
    const list = document.querySelector('.page');
    // タップで開く手入力（名前・ランク・スタミナ）
    const MANUAL_EDIT_TARGETS = [
      ['[data-name-edit]', el => beginEdit('name', Number(el.dataset.nameEdit))],
      ['[data-rank-edit]', el => beginEdit('rank', Number(el.dataset.rankEdit))],
      ['[data-stam-edit]', el => beginEdit('stam', Number(el.dataset.stamEdit))],
    ];
    list.addEventListener('pointerdown', event => {
      const target = event.target;
      if (target.matches('input')) {
        if (target.matches('[data-name-editor],[data-rank-editor],[data-stam-editor]')) {
          target.focus({ preventScroll:true });
        }
        return;
      }
      // ① 手入力（名前／ランク／スタミナ）
      for (const [selector, open] of MANUAL_EDIT_TARGETS) {
        const el = target.closest(selector);
        if (el) {
          event.preventDefault();
          open(el);
          return;
        }
      }
      // ② 40計算（スタミナの確定式タップ）
      const stamConfirm = target.closest('[data-stam-confirm]');
      if (stamConfirm) {
        event.preventDefault();
        activate(Number(stamConfirm.dataset.stamConfirm), 'stam');
        return;
      }
      // ③ 放置報酬の受取
      const row = target.closest('[data-task]');
      if (row && row.dataset.task !== 'stam') {
        event.preventDefault();
        activate(Number(row.dataset.i), row.dataset.task);
        return;
      }
    });
    list.addEventListener('input', event => {
      const input = event.target;
      if (input.matches('[data-stam-editor]')) { input.value=String(input.value||'').replace(/[^0-9]/g,'').slice(0,3); }
      if (input.matches('[data-rank-editor]')) { input.value=String(input.value||'').replace(/[^0-9]/g,'').slice(0,3); }
    });
    list.addEventListener('focusout', event => {
      const input = event.target;
      if (!edit || !input.matches('input')) return;
      const type = input.matches('[data-name-editor]') ? 'name' : input.matches('[data-rank-editor]') ? 'rank' : input.matches('[data-stam-editor]') ? 'stam' : '';
      if (type !== edit.type || Number(input.dataset[type + 'Editor']) !== edit.index) return;
      closeEdit(false);
    });
    document.addEventListener('pointerdown', event => {
      if (!selected || event.target.closest('[data-task]')) return;
      const index = selected.index;
      const task = selected.task;
      selected = null;
      clearSelectionVisual(index, task);
    });
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        hiddenAt = Date.now();
        if (refreshTimer) { clearTimeout(refreshTimer); refreshTimer = null; }
        if (resumeSyncTimer) { clearTimeout(resumeSyncTimer); resumeSyncTimer = null; }
        if (resumeRevealTimer) { clearTimeout(resumeRevealTimer); resumeRevealTimer = null; }
        const veil = document.getElementById('resume-veil');
        if (veil) veil.classList.remove('is-covering', 'is-revealing');
        // 保存は必要だが、重い同期I/Oで復帰直後の描画とぶつかりやすいので
        // 可能ならアイドルに回す（非対応環境は即時）。
        const persist = () => { try { write(); } catch (_) {} };
        if (typeof requestIdleCallback === 'function') requestIdleCallback(persist, { timeout: 400 });
        else setTimeout(persist, 0);
      } else {
        // 冷起動完了前は復帰同期しない
        if (appReady) syncAfterResume();
      }
    });
    // bfcache 復帰（一部 Android / 戻る操作）でも同じ経路へ
    window.addEventListener('pageshow', event => {
      if (event.persisted) syncAfterResume();
    });
  }

  startLunaby = function startLunaby(loaded) {
    applyLoaded(loaded);
    buildStaticList();
    setupEvents();
    buildSL();
    // 初回：名前/ランクは markup 済み。タイマー行だけ埋める。
    // スタミナ最大値はここで一度だけ書く（以降はランク変更時のみ）。
    const now = Date.now();
    refreshSL(now);
    for (let index = 0; index < state.slots.length; index += 1) {
      if (!refs[index]) continue;
      paintStamRow(index, now, { force:true, includeMax:true });
      paintIdleRow(index, now, { force:true });
    }
    scheduleRefresh();
    // 冷起動完了。これ以前の visibility は復帰扱いにしない（ベールなし）
    const veil = document.getElementById('resume-veil');
    if (veil) veil.classList.remove('is-covering', 'is-revealing');
    requestAnimationFrame(() => {
      appReady = true;
      hiddenAt = 0;
    });
  }

}


/* === gate === */
function renderV2OnlyGate(onInitialize) {
  const list = document.getElementById('list');
  const starleap = document.getElementById('starleap');
  if (list) {
    list.innerHTML = '<section class="pure-v2-gate" aria-live="polite"><strong>v2専用候補</strong><span>有効なv2保存がないため起動していません。</span><a href="#initialize" data-v2-initialize>初回起動する</a></section>';
    const action = list.querySelector('[data-v2-initialize]');
    if (action && typeof onInitialize === 'function') action.addEventListener('click', event => { event.preventDefault(); onInitialize(); }, { once:true });
  }
  if (starleap) starleap.textContent = '';
}

// 保存データ自体はあるのに起動処理側で例外が出たケース用。
// 「初回起動する」ボタンを出すと、同じ起動処理を再実行して同じエラーで
// 何も起きないように見えるだけなので、ここでは別メッセージだけを出す。
function renderStartupError() {
  const list = document.getElementById('list');
  const starleap = document.getElementById('starleap');
  if (list) {
    list.innerHTML = '<section class="pure-v2-gate" aria-live="polite"><strong>起動エラー</strong><span>保存データは見つかっていますが、起動処理でエラーが発生しました。コード側の問題の可能性があります（詳細はブラウザのコンソールを確認してください）。</span></section>';
  }
  if (starleap) starleap.textContent = '';
}


/* === first-launch === */
/** Initial-launch-only module. Do not import from normal runtime paths. */
const packInitialSlot = slot => [slot.label, slot.rank, slot.stamCurrent, slot.stamStart || 0, slot.idleStart || 0, 0];

function initializeV2Store(storage) {
  const existing = loadExistingV2Store(storage);
  if (existing) return existing;
  let stored = null;
  try { stored = storage.getItem(V2_STORAGE_KEY); } catch (_) { return null; }
  if (stored !== null && stored !== '') return null;
  const slots = Array.from({ length:SLOT_COUNT }, () => normalizeSlot());
  const sl = createSLState();
  const envelope = { v:V2_VERSION, s:slots.map(packInitialSlot), l:[sl.stamina.current, sl.stamina.start || 0, sl.orb.current, sl.orb.start || 0, 0] };
  try { storage.setItem(V2_STORAGE_KEY, JSON.stringify(envelope)); } catch (_) {}
  return { envelope, slots, sl, source:'initial', migrated:false };
}



/* === entry === */

const requestPersistence = () => {
  if (!(navigator.storage && navigator.storage.persist)) return;
  navigator.storage.persist().catch(() => {});
};
if (typeof requestIdleCallback === 'function') requestIdleCallback(requestPersistence, { timeout: 1500 });
else setTimeout(requestPersistence, 0);

const renderGate = onInitialize => renderV2OnlyGate(onInitialize);
const renderError = () => renderStartupError();

const initializeAndStart = () => {
  try {
    const initial = initializeV2Store(localStorage);
    if (initial) startLunaby(initial);
    else renderGate(initializeAndStart);
  } catch (error) {
    console.error('[lunaby] initializeAndStart failed', error);
    renderGate(initializeAndStart);
  }
};

try {
  const existing = loadExistingV2Store(localStorage);
  if (existing) startLunaby(existing);
  else renderGate(initializeAndStart);
} catch (error) {
  console.error('[lunaby] boot failed', error);
  try { renderError(); } catch (_) {}
}

  </script>
  <script>
    if ('serviceWorker' in navigator) {
      const registerSW = () => navigator.serviceWorker.getRegistration('./').then(registration => {
        if (registration) return;
        // updateViaCache:'all' は既存の更新フローを変えない。
        return navigator.serviceWorker.register('./sw.js', { scope: './', updateViaCache: 'all' });
      }).catch(() => {});
      window.addEventListener('load', () => {
        if (typeof requestIdleCallback === 'function') requestIdleCallback(registerSW, { timeout: 2000 });
        else setTimeout(registerSW, 0);
      }, { once: true });
    }
  </script>
