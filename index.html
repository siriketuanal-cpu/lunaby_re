<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>ルナビィ — v2専用</title>
  <meta name="theme-color" content="#05070a">
  <meta name="application-name" content="ルナビィ">
  <meta name="apple-mobile-web-app-title" content="ルナビィ">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <style>html,body{background:#05070a;}</style>
  <link rel="manifest" href="manifest.json">
  <!-- ランチャー／タスク一覧用：複数サイズ＋apple-touch を明示（Chromeアイコン落ち防止） -->
  <link rel="icon" type="image/png" sizes="192x192" href="lunaby-neko-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="lunaby-neko-512.png">
  <link rel="apple-touch-icon" href="lunaby-neko-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="lunaby-neko-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="lunaby-neko-512.png">
    <!-- パス固定キャッシュ（?rev= なし）。更新は LUNABY → REPAIR_SHELL のみ -->
    <link rel="modulepreload" href="text-list-v2-only-entry.mjs">
    <link rel="modulepreload" href="text-list.js">
    <link rel="modulepreload" href="lunaby-core.mjs">
    <link rel="stylesheet" href="text-list.css">
</head>
<body>
  <!-- 更新入口: 画面左上の軽いリンク。経路は従来どおり update.html -->
  <a class="update-corner" href="update.html" aria-label="アプリを更新">↻</a>
  <div id="resume-veil" class="resume-veil" aria-hidden="true"></div>
  <main class="page">
    <div id="list" class="account-list" aria-label="Dot Abyss テキストリスト"></div>
    <div id="starleap" aria-label="スターリープ テキストリスト"></div>
  </main>
  <script type="module" src="text-list-v2-only-entry.mjs"></script>
  <!-- 初回のみ登録。既存があれば触らない（update()しない＝TWA更新バー抑制） -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.getRegistration('./').then(registration => {
          if (registration) return;
          // updateViaCache:'all' で sw.js の余計な再検証を減らす
          return navigator.serviceWorker.register('./sw.js', { scope: './', updateViaCache: 'all' });
        }).catch(() => {});
      }, { once: true });
    }
  </script>
</body>
</html>
